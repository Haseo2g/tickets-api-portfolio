name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-demo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: aws-actions/setup-sam@v3
      - run: bash ./mvnw -B verify
      - run: sam validate --template-file template.yaml
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy
        run: >-
          sam deploy --template-file template.yaml --stack-name "$STACK_NAME"
          --region "$AWS_REGION" --s3-bucket "$SAM_ARTIFACT_BUCKET"
          --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          test -n "$API_URL"
          bash scripts/smoke.sh "$API_URL"
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
